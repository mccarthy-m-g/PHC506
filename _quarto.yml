project:
  type: book
  execute-dir: project
  # Regenerates chapters/*.qmd (the interactive webR versions) from the
  # RStudio-native sources in lectures/*.qmd, and rebuilds the download bundle.
  pre-render: scripts/build-webr.R

execute:
  # Course material intentionally includes chunks that demonstrate errors;
  # show the error output instead of halting the whole book render.
  error: true

book:
  title: "PHC 506: Introduction to R"
  author: ["Jasmine Hughes", "Michael McCarthy"]
  sidebar:
    tools:
      - icon: download
        href: phc506-materials.zip
        text: "Download course files"
  chapters:
    - index.qmd
    - course_structure.qmd
    - installing_r_rstudio.qmd
    - part: "Lecture 1: R Fundamentals"
      chapters:
        - chapters/Lecture1a_Why_R.qmd
        - chapters/Lecture1b_Getting_to_know_R_RStudio.qmd
        - chapters/Lecture1c_The_Basics.qmd
        - chapters/Lecture1d_Functions_Lists_and_Data_Frames.qmd
        - chapters/Lecture1e_Managing_R_environment.qmd
        - solutions/Lecture1_solutions.qmd
    - part: "Lecture 2: Working with Data Frames"
      chapters:
        - chapters/Lecture2a_Data_Frame_Basics.qmd
        - chapters/Lecture2b_Calculations_By_Row_or_Group.qmd
        - chapters/Lecture2c_Dates_Factors_Missing_Values.qmd
        - solutions/Lecture2_solutions.qmd
    - part: "Lecture 3: Plotting"
      chapters:
        - chapters/Lecture3a_Plotting_in_R.qmd
        - chapters/Lecture3b_Intro_to_ggplot2.qmd
        - chapters/Lecture3c_multivariate_ggplot2.qmd
        - chapters/Lecture3d_customizing_ggplot2.qmd
        - solutions/Lecture3_solutions.qmd
    - part: "Lecture 4: Programming"
      chapters:
        - chapters/Lecture4a_Writing_Your_Own_Functions.qmd
        - chapters/Lecture4b_if_and_else.qmd
        - chapters/Lecture4c_Loops.qmd
        - chapters/Lecture4d_Function_Scoping.qmd
        - chapters/Lecture4e_Combining_and_reshaping_data.qmd
        - solutions/Lecture4_solutions.qmd
    - part: "Practice Problems"
      chapters:
        - chapters/Practice_problems.qmd
        - practice_problems/Practice_problem_solutions.qmd
  appendices:
    - appendices/R_cheatsheet.qmd
    - appendices/statistics_in_R.qmd
    - appendices/additional_resources.qmd

format:
  live-html:
    theme: [cosmo, setup/PHC506.scss]
    df-print: tibble

engine: knitr

resources:
  - data
  - phc506-materials.zip
